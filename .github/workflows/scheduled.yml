name: Scheduled jobs

on:
  schedule:
    - cron: "30 2 * * *"   # roz 07:30 Pakistan (02:30 UTC): digest
    - cron: "0 */3 * * *"  # har 3 ghante: breaking alert check
    - cron: "30 4 * * 0"   # har Sunday 09:30 Pakistan: weekly report
    - cron: "0 3 * * 0"    # har Sunday 08:00 Pakistan: purana data saaf
    - cron: "5 * * * *"    # har ghante :05 par: users ki apne waqt wali digest
  workflow_dispatch:
    inputs:
      job:
        description: "Kaun sa job chalayein"
        type: choice
        options:
          - digest
          - alerts
          - weekly
          - videos
          - cleanup
          - user-digests
        default: digest

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_URL: ${{ secrets.API_URL }}
      API_KEY: ${{ secrets.API_KEY }}
    steps:
      - name: Job chunein
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          CHOSEN: ${{ inputs.job }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            JOB="$CHOSEN"
          elif [ "$SCHEDULE" = "30 2 * * *" ]; then
            JOB="digest"
          elif [ "$SCHEDULE" = "30 4 * * 0" ]; then
            JOB="weekly"
          elif [ "$SCHEDULE" = "0 3 * * 0" ]; then
            JOB="cleanup"
          elif [ "$SCHEDULE" = "5 * * * *" ]; then
            JOB="user-digests"
          else
            JOB="alerts"
          fi
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "Job: $JOB"

      - name: Service ko jagayein (free plan so jati hai)
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$API_URL/health" || true)
            echo "Health check $i: $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "Service jagi nahi"
          exit 1

      - name: Job chalayein
        env:
          JOB: ${{ steps.pick.outputs.job }}
        run: |
          code=$(curl -s -o response.txt -w "%{http_code}" --max-time 60 -X POST -H "X-API-Key: $API_KEY" "$API_URL/run-$JOB")
          cat response.txt; echo
          if [ "$code" = "409" ]; then echo "Dusra job chal raha hai, is run ko chhor diya"; exit 0; fi
          if [ "$code" != "200" ]; then echo "HTTP $code"; exit 1; fi
